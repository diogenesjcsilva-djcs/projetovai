services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: transporte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transporte
      POSTGRES_USER: transporte
      POSTGRES_PASSWORD: transporte_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transporte -d transporte"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: transporte-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  redis_data:
